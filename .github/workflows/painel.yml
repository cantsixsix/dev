name: Painel de ideias

on:
  schedule:
    - cron: "7 12 * * 1" # segunda-feira, 09:07 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar PAINEL.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: um token pessoal (secret PAINEL_TOKEN) faz o painel incluir repos privados.
          PAINEL_TOKEN: ${{ secrets.PAINEL_TOKEN }}
        run: python3 scripts/painel.py

      - name: Salvar se mudou
        run: |
          if git diff --quiet -- PAINEL.md && git ls-files --error-unmatch PAINEL.md >/dev/null 2>&1; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PAINEL.md
          git commit -m "Atualiza painel de ideias"
          git push
